[project]
name = "cooklang-mcp-server"
version = "0.1.0"
description = "FastMCP interface to a CookCLI recipe server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.scripts]
cooklang-mcp-server = "server:main"

[project.urls]
Repository = "https://github.com/alessmar/cooklang-mcp-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
